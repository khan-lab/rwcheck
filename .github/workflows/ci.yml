name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:

  # ── Tests + lint ─────────────────────────────────────────────────────────────
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy rwcheck rw_api scripts --ignore-missing-imports

      - name: Run tests
        run: pytest -v --tb=short

  # ── Docker build + GHCR push ─────────────────────────────────────────────────
  #
  # Matrix builds two images in parallel:
  #   ghcr.io/<owner>/rwcheck      — CLI  (docker/cli/Dockerfile)
  #   ghcr.io/<owner>/rwcheck-api  — API  (docker/api/Dockerfile)
  #
  docker:
    name: Docker — ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: rwcheck
            dockerfile: docker/cli/Dockerfile
            # Smoke test: run the CLI --help via its ENTRYPOINT
            smoke_args: "rwcheck --help"

          - image_name: rwcheck-api
            dockerfile: docker/api/Dockerfile
            # Smoke test: verify all packages import cleanly (no DB needed)
            smoke_args: "python -c \"import rw_api.main; print('import OK')\""

    steps:
      - uses: actions/checkout@v4

      # Log in to GHCR only for non-PR events (push to branch or tag).
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate image tags:
      #   push to main  → :latest + :sha-<short>
      #   push tag v1.2.3 → :1.2.3, :1.2, :1, :latest
      #   pull request  → :pr-<number>  (built but NOT pushed)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Enable BuildKit layer caching via GHA cache.
      # Each matrix leg uses its own cache scope to avoid collisions.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push — ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}

      # Quick sanity check using the freshly built (local) image.
      - name: Smoke test — ${{ matrix.image_name }}
        run: |
          docker run --rm --entrypoint "" \
            $(echo "${{ steps.meta.outputs.tags }}" | head -1) \
            ${{ matrix.smoke_args }}
