# ── rwcheck — Production Compose (EC2 + Caddy + Let's Encrypt) ───────────────
#
# Usage:
#   cp .env.example .env          # set ACME_EMAIL and tweak RATE_LIMIT
#   docker compose up -d
#
# Caddy obtains a certificate for rwcheck.khanlab.bio automatically via
# Let's Encrypt.  Ports 80 and 443 must be reachable from the internet
# (open them in the EC2 security group).

services:

  # ── Reverse proxy + TLS ────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"    # HTTP/3
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # ACME certs and state
      - caddy_config:/config      # Caddy runtime config
    environment:
      ACME_EMAIL: ${ACME_EMAIL}

  # ── rwcheck FastAPI app ─────────────────────────────────────────────────────
  rwcheck:
    image: rwcheck-api:latest
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped

    # Do not publish port 8000 to the host — Caddy reaches it on the
    # internal Docker network.
    expose:
      - "8000"

    volumes:
      # Persist the SQLite database across container restarts and upgrades.
      - rw_data:/app/data

    environment:
      RW_DB_PATH: /app/data/rw.sqlite
      RW_CSV_URL: ${RW_CSV_URL:-https://gitlab.com/crossref/retraction-watch-data/-/raw/main/retraction_watch.csv}
      RATE_LIMIT: ${RATE_LIMIT:-60/minute}
      UPDATE_INTERVAL_HOURS: ${UPDATE_INTERVAL_HOURS:-24}
      PUBLIC_HOST: ${PUBLIC_HOST:-https://rwcheck.khanlab.bio}

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      # DB download + ingest can take 60-120 s on first boot.
      start_period: 120s
      retries: 3

volumes:
  # Named volume for the Retraction Watch SQLite database.
  rw_data:
  # Named volumes for Caddy's certificate store and runtime config.
  caddy_data:
  caddy_config:
